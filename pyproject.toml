[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-vision-mcp"
version = "0.4.0"
description = "MCP Server that gives DeepSeek (and other text-only LLMs) vision capability via third-party OpenAI-compatible vision APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "deepseek-vision-mcp contributors" },
]
keywords = ["mcp", "deepseek", "vision", "multimodal", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp>=1.2.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/GOU-GEE/deepseek-vision"
Repository = "https://github.com/GOU-GEE/deepseek-vision.git"
Issues = "https://github.com/GOU-GEE/deepseek-vision/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "build>=1.2.0",
    "ruff>=0.8.0",
    "twine>=5.1.0",
]

[project.scripts]
deepseek-vision-mcp = "deepseek_vision_mcp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
