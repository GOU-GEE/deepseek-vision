name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  npm-dsh-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          npm ci --ignore-scripts --prefix plugins/dsh-plugin-deepseek-vision
          python -m pip install --upgrade build

      - name: Test and publish DSH bundle
        working-directory: plugins/dsh-plugin-deepseek-vision
        env:
          VISION_BUILD_PYTHON: python
          # 可选：npm 账号的发布 token（包所有者身份）。
          # 未配置时，若版本已存在（如作者已手动发布）则跳过，避免发布流程失败。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm test
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-plugin-deepseek-vision@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "npm 版本 $PKG_VERSION 已存在（可能已手动发布），跳过 npm publish"
          else
            npm publish --access public --provenance
          fi
