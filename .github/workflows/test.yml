name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -v

      - name: Real MCP stdio handshake smoke test
        run: |
          python - <<'EOF'
          """真实 stdio 冒烟：initialize → list_tools → 调用工具（无需真实 Key）。"""
          import asyncio
          import json
          import os

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(
                  command="python",
                  args=["-m", "deepseek_vision_mcp"],
                  env={**os.environ, "VISION_API_KEY": "ci-fake-key"},
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      names = sorted(t.name for t in tools.tools)
                      print("registered tools:", names)
                      for expected in ("analyze_image", "analyze_clipboard",
                                       "compare_images", "vision_status"):
                          assert expected in names, f"工具缺失: {expected}"
                      # 配置类工具无需真实 Key
                      res = await session.call_tool("vision_status", {})
                      payload = json.loads(res.content[0].text)
                      assert payload["configured"] is True
                      # 无效图片应返回结构化错误
                      res2 = await session.call_tool(
                          "analyze_image", {"image": "examples/not_exist.png"}
                      )
                      err = json.loads(res2.content[0].text)
                      assert err["error"] == "IMAGE_LOAD_FAILED"
              print("MCP stdio 握手冒烟测试通过")

          asyncio.run(main())
          EOF

      - name: Verify CLI entry point
        run: |
          # 校验配置命令在无 Key 时应给出明确报错（退出码 1）
          if deepseek-vision-mcp --check; then
            echo "预期无 Key 时 --check 失败，但命令成功了" >&2
            exit 1
          else
            echo "OK: 无 Key 时 --check 正确报错"
          fi

  mcp-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-version: ["1.2.0", "1.29.0", "2.0.0"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install against MCP ${{ matrix.mcp-version }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "mcp==${{ matrix.mcp-version }}"

      - name: Run compatibility suite
        run: pytest -q

  dsh-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: plugins/dsh-plugin-deepseek-vision/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Enable DSH package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install plugin and Python build dependencies
        run: |
          npm ci --ignore-scripts --prefix plugins/dsh-plugin-deepseek-vision
          python -m pip install --upgrade pip build
          python -m pip install -e .

      - name: Test DSH host, paste bridge and managed launcher
        run: npm test --prefix plugins/dsh-plugin-deepseek-vision

      - name: Pack portable DSH bundle
        env:
          VISION_BUILD_PYTHON: python
        run: |
          cd plugins/dsh-plugin-deepseek-vision
          npm pack
          tar -tf dsh-plugin-deepseek-vision-0.2.0.tgz | grep 'runtime/deepseek_vision_mcp-.*\.whl'
          tar -tf dsh-plugin-deepseek-vision-0.2.0.tgz | grep 'package/LICENSE'

      - name: Managed runtime MCP handshake
        env:
          VISION_BUILD_PYTHON: python
        run: python scripts/verify_dsh_plugin.py

      - name: Install bundle into an isolated official DSH profile
        run: |
          TARBALL="$GITHUB_WORKSPACE/plugins/dsh-plugin-deepseek-vision/dsh-plugin-deepseek-vision-0.2.0.tgz"
          for VERSION in 0.1.0-rc.5 0.1.0-rc.6; do
            export DSH_HOME="$RUNNER_TEMP/dsh-home-$VERSION"
            CONFIG="$RUNNER_TEMP/dsh-config-$VERSION.txt"
            npx -y "@deepseek-ai/dsh@$VERSION" plugin --profile web add "$TARBALL"
            npx -y "@deepseek-ai/dsh@$VERSION" --profile web --dump-config > "$CONFIG"
            grep -q 'deepseek-vision-host' "$CONFIG"
            grep -q 'deepseek-vision-mcp' "$CONFIG"
            grep -q 'deepseek-vision-mcp/launcher.mjs' "$CONFIG"
            grep -q 'DSH_HOME:' "$CONFIG"
          done

      - name: Validate DSH manifest and composition
        run: |
          node -e "const p=require('./plugins/dsh-plugin-deepseek-vision/package.json'); if(!p.dsh?.bundle?.patch||!p.dsh?.client) process.exit(1)"
          grep -q "@deepseek-ai/dsh-mcp-client" plugins/dsh-plugin-deepseek-vision/cordis.patch.yml
          grep -q "deepseek-vision-mcp/launcher.mjs" plugins/dsh-plugin-deepseek-vision/cordis.patch.yml
          grep -q "DSH_HOME:" plugins/dsh-plugin-deepseek-vision/cordis.patch.yml
